name: Build and release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Verify version and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import json, os; v=json.load(open("src/manifest.json"))["version"]; assert os.environ["RELEASE_TAG"] == "v"+v; assert json.load(open("package.json"))["version"] == v'
          python scripts/build.py --repository "$GITHUB_REPOSITORY"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.xpi dist/*.sha256 dist/updates.json --verify-tag --title "Zotero–Obsidian Connector $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --latest
